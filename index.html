<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        
        svg {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦤 鹈鹕骑自行车 🚲</h1>
        <svg width="800" height="400" viewBox="0 0 800 400">
            <defs>
                <!-- 轮子旋转动画 -->
                <style>
                    @keyframes wheelRotate {
                        from {
                            transform: rotate(0deg);
                        }
                        to {
                            transform: rotate(360deg);
                        }
                    }
                    
                    @keyframes bikeMove {
                        from {
                            transform: translateX(0px);
                        }
                        to {
                            transform: translateX(650px);
                        }
                    }
                    
                    @keyframes bodyBounce {
                        0%, 100% {
                            transform: translateY(0px);
                        }
                        50% {
                            transform: translateY(-8px);
                        }
                    }
                    
                    @keyframes legPedal {
                        0% {
                            transform: rotate(0deg);
                        }
                        100% {
                            transform: rotate(360deg);
                        }
                    }
                    
                    @keyframes headNod {
                        0%, 100% {
                            transform: rotate(0deg);
                        }
                        50% {
                            transform: rotate(-5deg);
                        }
                    }
                    
                    .wheel {
                        animation: wheelRotate 1s linear infinite;
                    }
                    
                    .bike-group {
                        animation: bikeMove 8s linear infinite;
                    }
                    
                    .pelican-body {
                        animation: bodyBounce 0.6s ease-in-out infinite;
                    }
                    
                    .pedal-crank {
                        animation: legPedal 1s linear infinite;
                        transform-origin: 70px 200px;
                    }
                    
                    .pelican-head {
                        animation: headNod 1.5s ease-in-out infinite;
                        transform-origin: 85px 120px;
                    }
                </style>
            </defs>
            
            <!-- 背景 -->
            <rect width="800" height="400" fill="url(#bgGradient)"/>
            
            <!-- 地面 -->
            <rect y="300" width="800" height="100" fill="#90EE90"/>
            <line x1="0" y1="300" x2="800" y2="300" stroke="#228B22" stroke-width="3"/>
            
            <!-- 路面标线 -->
            <line x1="0" y1="320" x2="800" y2="320" stroke="#FFD700" stroke-width="2" stroke-dasharray="30,20"/>
            
            <!-- 主要动画组 -->
            <g class="bike-group">
                <!-- 自行车架 -->
                <g id="bicycle">
                    <!-- 前轮 -->
                    <g class="wheel" style="transform-origin: 150px 280px;">
                        <circle cx="150" cy="280" r="50" fill="none" stroke="#333" stroke-width="4"/>
                        <circle cx="150" cy="280" r="48" fill="none" stroke="#888" stroke-width="1"/>
                        <circle cx="150" cy="280" r="40" fill="none" stroke="#888" stroke-width="1"/>
                        <!-- 轮辐 -->
                        <line x1="150" y1="230" x2="150" y2="330" stroke="#666" stroke-width="2"/>
                        <line x1="100" y1="280" x2="200" y2="280" stroke="#666" stroke-width="2"/>
                        <line x1="114" y1="244" x2="186" y2="316" stroke="#666" stroke-width="2"/>
                        <line x1="186" y1="244" x2="114" y2="316" stroke="#666" stroke-width="2"/>
                        <circle cx="150" cy="280" r="6" fill="#333"/>
                    </g>
                    
                    <!-- 后轮 -->
                    <g class="wheel" style="transform-origin: 350px 280px;">
                        <circle cx="350" cy="280" r="50" fill="none" stroke="#333" stroke-width="4"/>
                        <circle cx="350" cy="280" r="48" fill="none" stroke="#888" stroke-width="1"/>
                        <circle cx="350" cy="280" r="40" fill="none" stroke="#888" stroke-width="1"/>
                        <!-- 轮辐 -->
                        <line x1="350" y1="230" x2="350" y2="330" stroke="#666" stroke-width="2"/>
                        <line x1="300" y1="280" x2="400" y2="280" stroke="#666" stroke-width="2"/>
                        <line x1="314" y1="244" x2="386" y2="316" stroke="#666" stroke-width="2"/>
                        <line x1="386" y1="244" x2="314" y2="316" stroke="#666" stroke-width="2"/>
                        <circle cx="350" cy="280" r="6" fill="#333"/>
                    </g>
                    
                    <!-- 自行车架 -->
                    <line x1="150" y1="280" x2="250" y2="180" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
                    <line x1="150" y1="280" x2="350" y2="280" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
                    <line x1="250" y1="180" x2="350" y2="280" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
                    <line x1="250" y1="180" x2="150" y2="280" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
                    
                    <!-- 踏板曲柄 -->
                    <g class="pedal-crank">
                        <line x1="250" y1="220" x2="250" y2="280" stroke="#333" stroke-width="4"/>
                        <!-- 踏板 -->
                        <circle cx="250" cy="230" r="8" fill="#FFD700"/>
                        <circle cx="250" cy="270" r="8" fill="#FFD700"/>
                    </g>
                    
                    <!-- 把手 -->
                    <line x1="150" y1="280" x2="120" y2="260" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="120" cy="260" r="6" fill="#333"/>
                    <circle cx="135" cy="270" r="4" fill="#FFD700"/>
                </g>
                
                <!-- 鹈鹕 -->
                <g class="pelican-body">
                    <!-- 身体 -->
                    <ellipse cx="250" cy="160" rx="45" ry="50" fill="#F5DEB3" stroke="#8B7355" stroke-width="2"/>
                    
                    <!-- 翅膀 -->
                    <ellipse cx="220" cy="150" rx="35" ry="25" fill="#DEB887" stroke="#8B7355" stroke-width="1.5"/>
                    <ellipse cx="280" cy="150" rx="35" ry="25" fill="#DEB887" stroke="#8B7355" stroke-width="1.5"/>
                    
                    <!-- 头部 -->
                    <g class="pelican-head">
                        <circle cx="250" cy="110" r="20" fill="#F5DEB3" stroke="#8B7355" stroke-width="2"/>
                        
                        <!-- 特征性长嘴 -->
                        <path d="M 265 110 Q 300 108 320 105" fill="none" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 265 115 Q 300 120 320 125" fill="none" stroke="#D2B48C" stroke-width="3" stroke-linecap="round"/>
                        
                        <!-- 眼睛 -->
                        <circle cx="255" cy="105" r="3" fill="#000"/>
                        <circle cx="256" cy="104" r="1" fill="#FFF"/>
                        
                        <!-- 头顶羽毛 -->
                        <path d="M 245 90 Q 250 75 255 90" fill="#D2B48C" stroke="#8B7355" stroke-width="1.5"/>
                        <path d="M 240 92 Q 242 78 245 92" fill="#D2B48C" stroke="#8B7355" stroke-width="1.5"/>
                    </g>
                    
                    <!-- 腿部 -->
                    <line x1="230" y1="205" x2="225" y2="260" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                    <line x1="270" y1="205" x2="275" y2="260" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                    
                    <!-- 脚 -->
                    <ellipse cx="225" cy="265" rx="6" ry="8" fill="#FF8C00"/>
                    <ellipse cx="275" cy="265" rx="6" ry="8" fill="#FF8C00"/>
                </g>
            </g>
            
            <!-- 云彩装饰 -->
            <g opacity="0.7">
                <ellipse cx="100" cy="50" rx="40" ry="20" fill="#FFF"/>
                <ellipse cx="130" cy="50" rx="35" ry="20" fill="#FFF"/>
                <ellipse cx="70" cy="50" rx="30" ry="20" fill="#FFF"/>
                
                <ellipse cx="650" cy="80" rx="45" ry="22" fill="#FFF"/>
                <ellipse cx="690" cy="80" rx="40" ry="22" fill="#FFF"/>
                <ellipse cx="610" cy="80" rx="35" ry="22" fill="#FFF"/>
            </g>
        </svg>
    </div>
</body>
</html>
